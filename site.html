<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --border: #e2e2e2;
    --head-bg: #f5f5f5; --accent: #2563eb; --sim: #16803c; --nao: #b91c1c; --depende: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --fg: #e8e8e8; --muted: #9aa0a6; --border: #333;
      --head-bg: #20232a; --accent: #60a5fa; --sim: #4ade80; --nao: #f87171; --depende: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --fg: #e8e8e8; --muted: #9aa0a6; --border: #333;
    --head-bg: #20232a; --accent: #60a5fa; --sim: #4ade80; --nao: #f87171; --depende: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); margin: 0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  input[type=search], select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font-size: 0.9rem;
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 0.88rem; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--head-bg); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--accent); }
  tr:last-child td { border-bottom: none; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tag { padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .tag.sim { color: var(--sim); background: color-mix(in srgb, var(--sim) 15%, transparent); }
  .tag.nao { color: var(--nao); background: color-mix(in srgb, var(--nao) 15%, transparent); }
  .tag.depende { color: var(--depende); background: color-mix(in srgb, var(--depende) 15%, transparent); }
  .tag.desconhecido { color: var(--muted); background: color-mix(in srgb, var(--muted) 15%, transparent); }
  .obs { color: var(--muted); font-size: 0.82rem; }
  .count { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Sites para Busca de Vagas</h1>
  <p class="sub">Tabela única e filtrável — clique nos cabeçalhos para ordenar. "—" significa que ainda não foi avaliado.</p>

  <div class="controls">

<option value="Estágios e trainee">Estágios e trainee</option>

          <th>Observação</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="count" id="count"></div>

function tag(value) {
  if (value === "Sim") return '<span class="tag sim">Sim</span>';
  if (value === "Não") return '<span class="tag nao">Não</span>';
  if (value === "Depende") return '<span class="tag depende">Depende</span>';
  return '<span class="tag desconhecido">—</span>';
}

let sortKey = 'n', sortAsc = true;

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cat = document.getElementById('cat').value;
  const busca = document.getElementById('buscaFiltro').value;

  let rows = DATA.filter(d => {
    if (q && !d.n.toLowerCase().includes(q)) return false;
    if (cat && d.c !== cat) return false;
    if (busca && d.b !== busca) return false;
    return true;
  });

  rows.sort((a, b) => {
    let r = String(a[sortKey]).localeCompare(String(b[sortKey]), 'pt-BR');
    return sortAsc ? r : -r;
  });

  document.getElementById('body').innerHTML = rows.map(d => `
    <tr>
      <td><a href="${d.l}" target="_blank" rel="noopener">${d.n}</a></td>
      <td>${d.c}</td>
      <td>${tag(d.b)}</td>
      <td>${tag(d.s)}</td>
      <td class="obs">${d.o || ''}</td>
    </tr>
  `).join('');

  document.getElementById('count').textContent = `${rows.length} de ${DATA.length} sites`;
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('cat').addEventListener('change', render);
document.getElementById('buscaFiltro').addEventListener('change', render);
document.querySelectorAll('th[data-k]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.k;
    if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
    render();
  });
});

render();
</script>
